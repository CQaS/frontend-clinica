<div class="login-wrapper">
  <div class="login-card">
    
    <div class="login-header">
      <div class="icon-circle">
        <i class="pi pi-shield"></i>
      </div>
      <h2>Clínica Médica</h2>
      <p>Sistema de Gestión y Acceso</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="iniciarSesion()" class="login-form">
      
      <!-- Campo Usuario -->
      <div class="form-group">
        <label for="nombre">Usuario</label>
        <div class="input-icon-wrapper">
          <i class="pi pi-user"></i>
          <input 
            id="nombre" 
            type="text" 
            formControlName="nombre" 
            placeholder="Ingrese su usuario" 
            class="custom-input"
            autocomplete="off" 
          />
        </div>
      </div>

      <!-- Campo Contraseña con PrimeNG -->
      <div class="form-group">
        <label for="clave">Contraseña</label>
        <div class="password-wrapper">
          <p-password 
            formControlName="clave" 
            [feedback]="false" 
            placeholder="Ingrese su clave" 
            [toggleMask]="true" 
            styleClass="w-full"
            inputStyleClass="custom-input-password"
          ></p-password>
        </div>
      </div>

      <!-- Botón de Inicio de Sesión -->
      <div class="form-actions">
        <p-button 
          label="Iniciar Sesión" 
          icon="pi pi-sign-in" 
          styleClass="p-button-raised p-button-rounded w-full custom-btn"
          (click)="iniciarSesion()">
        </p-button>
      </div>

    </form>
  </div>
</div>
