<div style="padding: 20px; font-family: Arial, sans-serif;">

  <h2 style="margin: 0 0 20px;">Agenda Médica - Mis Turnos</h2>

  <div style="margin-bottom: 25px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: #fff;">
    <h3 style="margin-top: 0; font-size: 1.1rem; color: #333;">Filtrar Turnos</h3>
    <div style="display: flex; align-items: center; gap: 10px;">
      <label for="fechaTurnos" style="font-weight: bold; color: #333;">Seleccionar fecha: </label>
      <input type="date" id="fechaTurnos" [(ngModel)]="fechaSeleccionada" (change)="cargarTurnos()"
        style="padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; background: #ffffff; color: #000000 !important; font-size: 14px; outline: none; cursor: pointer;" />
    </div>
  </div>

  <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px;">
    <h3 style="margin-top: 0;">Listado de Turnos</h3>

    <div style="background: white; padding: 10px; overflow-x: auto;">
      <p-table [value]="turnos" [loading]="cargando" [tableStyle]="{'min-width': '50rem'}">
        <ng-template pTemplate="header">
          <tr>
            <th>ID del turno</th>
            <th>Fecha y Hora</th>
            <th>Paciente</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-turno>
          <tr>
            <td>{{ turno.id }}</td>
            <td>{{ turno.fechaHora | date:'dd/MM/yyyy HH:mm' }}</td>
            <td>{{ turno.nombrePaciente }}</td>
            <td>
              <span [style.color]="turno.estado === 'CANCELADO' ? 'red' : 'green'" style="font-weight: bold;">
                {{ turno.estado }}
              </span>
            </td>
            <td>
              <p-button label="Atendido" severity="success" size="small" styleClass="p-mr-2"
                (onClick)="cambiarEstado(turno.id, estadoReserva.ATENDIDO)">
              </p-button>
              <p-button label="Ausente" severity="danger" size="small"
                (onClick)="cambiarEstado(turno.id, estadoReserva.AUSENTE)">
              </p-button>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" style="text-align: center; padding: 20px; color: #666;">
              No hay turnos registrados para la fecha seleccionada.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
