<div class="card">
  <h2>Reservar Turno</h2>


  <label for="medico">Seleccione Médico:</label>
  <select id="medico" [(ngModel)]="medicoSeleccionadoId">
    <option value="" disabled selected>-- Seleccione un médico --</option>


    @for (m of medicos; track m.id) {
    <option [value]="m.id">
      Dr/Dra. {{ m.apellidos }}, {{ m.nombres }}
    </option>
    }
  </select>


  <label for="fecha">Fecha:</label>
  <input type="date" id="fecha" [min]="minFecha" [max]="maxFecha" [(ngModel)]="fechaSeleccionada">


  <label for="hora">Hora:</label>
  <select id="hora" [(ngModel)]="horaSeleccionada">
    <option value="" disabled selected>-- Seleccione un horario --</option>

    @for (h of horariosDisponibles; track h) {
    <option [value]="h">{{ h }}</option>
    }
  </select>

  <button (click)="confirmarReserva()">Confirmar Reserva</button>
</div>
